services:
  postgres:
    image: postgres:15-alpine
    container_name: bizclone_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bizclone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizclone_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bizclone_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bizclone_user} -d ${POSTGRES_DB:-bizclone_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bizclone_network

  redis:
    image: redis:7-alpine
    container_name: bizclone_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bizclone_network

volumes:
  postgres_data:
  redis_data:

networks:
  bizclone_network:
    driver: bridge
